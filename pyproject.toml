[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-trajectory-demo"
version = "0.1.0"
description = "Desktop demo for EEG-based 3D wrist trajectory decoding"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
trajdemo = "trajdemo.app:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
